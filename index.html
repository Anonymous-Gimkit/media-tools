<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio &amp; Video playback with speed control</title>
  <style>
    @font-face {
      font-family: "DuckSans";
      src: url("fonts/DS.woff2");
    }
    body {
      max-width: 760px;
      margin: 3rem auto;
      padding: 0 1rem;
      font: 16px/1.5 system-ui, sans-serif;
      color: #222;
    }

    h1 {
      font-size: 1.6rem;
    }

    #media {
      display: block;
      width: 100%;
      max-height: 70vh;
      margin: 1.25rem 0;
      background: #111;
      border-radius: 8px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
    }

    input,
    select {
      font: inherit;
      padding: 0.45rem 0.6rem;
    }

    #status {
      color: #555;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h1>Local Audio &amp; Video Player</h1>

  <div class="controls">
    <label>
      Choose a file:
      <input id="filePicker" type="file" accept="audio/*,video/*">
    </label>

    <label>
      Speed:
      <select id="speed">
        <option value="0.25">0.25×</option>
        <option value="0.5">0.5×</option>
        <option value="0.75">0.75×</option>
        <option value="1" selected>1×</option>
        <option value="1.25">1.25×</option>
        <option value="1.5">1.5×</option>
        <option value="1.75">1.75×</option>
        <option value="2">2×</option>
        <option value="2.5">2.5×</option>
        <option value="3">3×</option>
        <option value="4">4×</option>
      </select>
    </label>
  </div>

  <video id="media" controls playsinline hidden></video>
  <p id="status">Select an audio or video file to play it here.</p>

  <script>
    const filePicker = document.getElementById("filePicker");
    const media = document.getElementById("media");
    const speed = document.getElementById("speed");
    const status = document.getElementById("status");

    let currentUrl = null;

    filePicker.addEventListener("change", () => {
      const file = filePicker.files[0];
      if (!file) return;

      if (currentUrl) {
        URL.revokeObjectURL(currentUrl);
      }

      currentUrl = URL.createObjectURL(file);
      media.src = currentUrl;
      media.playbackRate = Number(speed.value);
      media.hidden = false;
      status.textContent = file.name;
      media.load();
    });

    speed.addEventListener("change", () => {
      media.playbackRate = Number(speed.value);
    });

    window.addEventListener("beforeunload", () => {
      if (currentUrl) {
        URL.revokeObjectURL(currentUrl);
      }
    });
  </script>
</body>
</html>
